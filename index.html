<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 針對 Line / FB 等社群軟體預覽的設定 -->
    <title>新北市立秀峰高級中學115-1 班級課表查詢【對內版】</title>
    <meta name="description" content="115-1 課表查詢">
    <meta property="og:title" content="新北市立秀峰高級中學115-1 班級課表查詢【對內版】">
    <meta property="og:description" content="115-1 課表查詢">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="秀峰高中課表查詢系統">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .table-row-sep td { border-bottom: 4px solid #374151 !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        <!-- 標題區 (對內版：咖啡色系) -->
        <div class="bg-amber-900 text-white p-6 text-center">
            <h1 class="text-3xl font-bold tracking-wider">新北市立秀峰高級中學115-1 班級課表查詢【對內版】</h1>
        </div>

        <div class="p-6">
            <!-- 搜尋與狀態列 -->
            <div class="bg-amber-50 p-5 rounded-lg border border-amber-200 shadow-sm mb-6 flex flex-col md:flex-row items-center justify-between">
                <div class="flex flex-col sm:flex-row w-full md:w-3/4 mb-4 md:mb-0 gap-2 items-start sm:items-center">
                    <label class="font-bold text-amber-900 whitespace-nowrap">選擇班級：</label>
                    <div class="flex w-full flex-col sm:flex-row gap-2">
                        <!-- 第一層：選擇部別 -->
                        <select id="divisionSelect" disabled class="form-select block w-full sm:w-1/3 px-4 py-2 text-base text-gray-700 bg-gray-100 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-amber-600 disabled:cursor-not-allowed">
                            <option value="">資料庫載入中...</option>
                        </select>
                        
                        <!-- 第二層：選擇班級 -->
                        <div class="flex w-full sm:w-2/3">
                            <select id="classSelect" disabled class="form-select block w-full px-4 py-2 text-base text-gray-700 bg-gray-100 border border-gray-300 rounded-l focus:outline-none focus:ring-2 focus:ring-amber-600 disabled:cursor-not-allowed border-r-0">
                                <option value="">請先選擇部別</option>
                            </select>
                            <button id="searchBtn" disabled
                                    class="px-6 py-2 bg-gray-400 text-white font-medium text-sm leading-tight uppercase rounded-r shadow-md disabled:cursor-not-allowed transition duration-150 ease-in-out whitespace-nowrap">
                                查詢
                            </button>
                        </div>
                    </div>
                </div>
                <div id="statusIndicator" class="text-sm font-bold text-gray-500 w-full md:w-auto text-left md:text-right mt-2 md:mt-0">
                    🔄 正在尋找 class.csv...
                </div>
            </div>

            <!-- 隱藏的上傳區塊 -->
            <div id="fallbackUploadArea" class="hidden bg-yellow-50 p-5 rounded-lg border border-yellow-300 shadow-sm mb-6">
                <h2 class="font-bold text-lg text-red-600 mb-3 flex items-center">
                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    請將資料庫檔名更正為 class.csv，或手動匯入檔案
                </h2>
                <label for="fileInput" class="block text-sm font-medium text-gray-700 mb-2">手動上傳正確的班級課表檔案 (.csv, .xls, .xlsx)：</label>
                <input type="file" id="fileInput" accept=".csv, .xls, .xlsx" 
                       class="block w-full text-sm text-gray-500
                              file:mr-4 file:py-2 file:px-4
                              file:rounded-md file:border-0
                              file:text-sm file:font-semibold
                              file:bg-yellow-600 file:text-white
                              hover:file:bg-yellow-700 cursor-pointer">
            </div>

            <!-- 查詢結果的標題 (顯示當前搜尋的班級) -->
            <div id="resultHeader" class="hidden mb-4 mt-2 text-center">
                <h2 id="currentClassTitle" class="text-2xl font-bold text-amber-900 border-b-2 border-amber-900 inline-block pb-1 px-4"></h2>
            </div>

            <!-- 課表顯示區 -->
            <div class="overflow-x-auto rounded-lg border border-gray-200 shadow-sm">
                <!-- 加上 table-fixed 確保每一天的欄位等寬，min-w-[800px] 防止手機版擠壓變形 -->
                <table class="w-full min-w-[800px] divide-y divide-gray-200 text-center table-fixed">
                    <thead class="bg-gray-50">
                        <tr>
                            <!-- 第一欄固定寬度 -->
                            <th scope="col" class="px-2 py-3 text-sm font-bold text-gray-700 uppercase tracking-wider border-r border-gray-200 w-[100px] md:w-[120px]">節次 \ 星期</th>
                            <!-- 星期一至五不設寬度，讓 table-fixed 自動均分剩餘空間 -->
                            <th scope="col" class="px-2 py-3 text-sm font-bold text-gray-700 uppercase tracking-wider border-r border-gray-200">一</th>
                            <th scope="col" class="px-2 py-3 text-sm font-bold text-gray-700 uppercase tracking-wider border-r border-gray-200">二</th>
                            <th scope="col" class="px-2 py-3 text-sm font-bold text-gray-700 uppercase tracking-wider border-r border-gray-200">三</th>
                            <th scope="col" class="px-2 py-3 text-sm font-bold text-gray-700 uppercase tracking-wider border-r border-gray-200">四</th>
                            <th scope="col" class="px-2 py-3 text-sm font-bold text-gray-700 uppercase tracking-wider">五</th>
                        </tr>
                    </thead>
                    <tbody id="timetableBody" class="bg-white divide-y divide-gray-200">
                        <tr>
                            <td colspan="6" class="px-6 py-12 text-center text-gray-500">
                                <div id="noDataMessage" class="flex flex-col items-center">
                                    <svg class="w-12 h-12 text-gray-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10l4 4v10a2 2 0 01-2 2z"></path></svg>
                                    <p class="text-lg font-medium">請選擇班級並點擊查詢</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const seniorHighTimes = {
            1: "08:10-09:00", 2: "09:10-10:00", 3: "10:10-11:00", 4: "11:10-12:00",
            5: "13:05-13:55", 6: "14:05-14:55", 7: "15:10-16:00", 8: "16:05-16:55" 
        };

        const juniorHighTimes = {
            1: "08:20-09:05", 2: "09:15-10:00", 3: "10:10-10:55", 4: "11:10-11:55",
            5: "13:05-13:50", 6: "14:05-14:50", 7: "15:10-15:55", 8: "16:05-16:50"
        };

        const weekDayMap = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '日': 7 };
        
        let scheduleByClass = {}; 
        let juniorHighClasses = [];
        let seniorHighClasses = [];

        const fileInput = document.getElementById('fileInput');
        const statusIndicator = document.getElementById('statusIndicator');
        const divisionSelect = document.getElementById('divisionSelect');
        const classSelect = document.getElementById('classSelect');
        const searchBtn = document.getElementById('searchBtn');
        const timetableBody = document.getElementById('timetableBody');
        const fallbackUploadArea = document.getElementById('fallbackUploadArea');
        
        const resultHeader = document.getElementById('resultHeader');
        const currentClassTitle = document.getElementById('currentClassTitle');

        function isJuniorHigh(className) {
            if (!className) return false;
            const str = className.toString().trim();
            if (str.startsWith('7') || str.startsWith('8') || str.startsWith('9')) return true;
            if (str.includes('國')) return true;
            return false;
        }

        function processParsedData(parsedData) {
            scheduleByClass = {}; 
            let successCount = 0;
            let juniorSet = new Set();
            let seniorSet = new Set();

            parsedData.forEach(row => {
                const rawClassName = (row['班級'] || row['班級名稱'] || '').toString().trim();
                const className = rawClassName.replace(/\.0$/, ''); 
                
                // 加入「授課教師」辨識
                const teacher = (row['授課教師'] || row['教師姓名'] || row['教師'] || row['姓名'] || '').toString().trim();
                const subject = (row['課程名稱'] || row['課程'] || row['科目'] || '').toString().trim();
                
                const dayStr = (row['星期'] || '').toString().trim();
                const day = weekDayMap[dayStr] || parseInt(dayStr); 
                const period = parseInt(row['節次']);
                
                let oddEven = '';
                const rawWeek = row['週別'] || '';
                if (rawWeek.toString().includes('單')) oddEven = '單';
                if (rawWeek.toString().includes('雙')) oddEven = '雙';
                
                const location = (row['上課地點'] || row['地點'] || row['教室'] || '').toString().trim();

                if (!className || isNaN(day) || isNaN(period)) return;

                if (isJuniorHigh(className)) {
                    juniorSet.add(className);
                } else {
                    seniorSet.add(className);
                }

                if (!scheduleByClass[className]) scheduleByClass[className] = { 1:{}, 2:{}, 3:{}, 4:{}, 5:{} };
                if (!scheduleByClass[className][day][period]) scheduleByClass[className][day][period] = [];
                
                if (day >= 1 && day <= 5) {
                    scheduleByClass[className][day][period].push({ subject, teacher, oddEven, location });
                    successCount++;
                }
            });

            if (successCount > 0) {
                juniorHighClasses = Array.from(juniorSet).sort((a, b) => a.localeCompare(b, 'zh-Hant-TW', {numeric: true}));
                seniorHighClasses = Array.from(seniorSet).sort((a, b) => a.localeCompare(b, 'zh-Hant-TW', {numeric: true}));

                statusIndicator.innerHTML = `✅ 成功讀取 <b>${successCount}</b> 筆資料`;
                statusIndicator.className = "text-sm font-bold text-amber-700 w-full md:w-auto text-left md:text-right mt-4 md:mt-0";
                
                divisionSelect.innerHTML = `
                    <option value="">請選擇部別</option>
                    ${juniorHighClasses.length > 0 ? '<option value="junior">國中部</option>' : ''}
                    ${seniorHighClasses.length > 0 ? '<option value="senior">高中部</option>' : ''}
                `;
                divisionSelect.disabled = false;
                divisionSelect.classList.remove('bg-gray-100');
                divisionSelect.classList.add('bg-white');

                classSelect.innerHTML = '<option value="">請先選擇部別</option>';
                fallbackUploadArea.classList.add('hidden');
            } else {
                showErrorFallback();
            }
        }

        function clearTimetableDisplay() {
            resultHeader.classList.add('hidden');
            timetableBody.innerHTML = `
                <tr>
                    <td colspan="6" class="px-6 py-12 text-center text-gray-500">
                        <div class="flex flex-col items-center">
                            <svg class="w-12 h-12 text-gray-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                            <p class="text-lg font-medium">設定已變更</p>
                            <p class="text-sm">請點擊上方「查詢」按鈕顯示課表</p>
                        </div>
                    </td>
                </tr>
            `;
        }

        divisionSelect.addEventListener('change', function() {
            classSelect.innerHTML = '<option value="">請選擇班級</option>';
            
            if (this.value === 'junior') {
                juniorHighClasses.forEach(c => classSelect.add(new Option(c, c)));
                classSelect.disabled = false;
                classSelect.classList.remove('bg-gray-100');
                classSelect.classList.add('bg-white');
            } else if (this.value === 'senior') {
                seniorHighClasses.forEach(c => classSelect.add(new Option(c, c)));
                classSelect.disabled = false;
                classSelect.classList.remove('bg-gray-100');
                classSelect.classList.add('bg-white');
            } else {
                classSelect.innerHTML = '<option value="">請先選擇部別</option>';
                classSelect.disabled = true;
                classSelect.classList.add('bg-gray-100');
                classSelect.classList.remove('bg-white');
            }

            searchBtn.disabled = true;
            searchBtn.classList.replace('bg-amber-700', 'bg-gray-400');
            clearTimetableDisplay(); 
        });

        classSelect.addEventListener('change', function() {
            if (this.value) {
                searchBtn.disabled = false;
                searchBtn.classList.replace('bg-gray-400', 'bg-amber-700');
                searchBtn.classList.add('hover:bg-amber-800');
            } else {
                searchBtn.disabled = true;
                searchBtn.classList.replace('bg-amber-700', 'bg-gray-400');
                searchBtn.classList.remove('hover:bg-amber-800');
            }
            clearTimetableDisplay(); 
        });

        function showErrorFallback() {
            alert("請將資料庫檔名更正為 class.csv，或手動匯入檔案");
            statusIndicator.innerHTML = `❌ 載入失敗`;
            statusIndicator.className = "text-sm font-bold text-red-600 w-full md:w-auto text-left md:text-right mt-4 md:mt-0";
            divisionSelect.innerHTML = '<option value="">請先上傳檔案...</option>';
            fallbackUploadArea.classList.remove('hidden');
        }

        function parseExcelData(dataBuffer) {
            try {
                const workbook = XLSX.read(dataBuffer, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                processParsedData(jsonData);
            } catch (error) {
                showErrorFallback();
            }
        }

        async function attemptAutoLoad() {
            const targetFile = 'class.csv';
            try {
                const res = await fetch(targetFile, { method: 'HEAD', cache: 'no-store' });
                if (res.ok) {
                    statusIndicator.innerHTML = `✅ 找到 ${targetFile}，正在載入...`;
                    Papa.parse(targetFile, {
                        download: true,
                        header: true,
                        skipEmptyLines: true,
                        complete: function(results) { processParsedData(results.data); },
                        error: function() { showErrorFallback(); }
                    });
                } else {
                    showErrorFallback();
                }
            } catch (e) {
                showErrorFallback();
            }
        }

        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            statusIndicator.innerHTML = `🔄 檔案解析中...`;
            statusIndicator.className = "text-sm font-bold text-amber-600 w-full md:w-auto text-left md:text-right mt-4 md:mt-0";

            if (file.name.toLowerCase().endsWith('.csv')) {
                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) { processParsedData(results.data); },
                    error: function() { showErrorFallback(); }
                });
            } else {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const data = new Uint8Array(e.target.result);
                    parseExcelData(data);
                };
                reader.onerror = function() { showErrorFallback(); };
                reader.readAsArrayBuffer(file);
            }
        });

        function renderTimetable(searchClassName) {
            timetableBody.innerHTML = ''; 
            
            if (!searchClassName || !scheduleByClass[searchClassName]) {
                resultHeader.classList.add('hidden');
                timetableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-12 text-center text-red-500">
                            <div class="flex flex-col items-center">
                                <svg class="w-12 h-12 text-red-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                <p class="text-lg font-medium">找不到「${searchClassName || '空值'}」的課表</p>
                                <p class="text-sm">請確認資料庫是否正確。</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            currentClassTitle.textContent = `${searchClassName} 班級課表`;
            resultHeader.classList.remove('hidden');

            const classData = scheduleByClass[searchClassName];
            const periods = [
                { num: 1, label: "第1節" }, { num: 2, label: "第2節" },
                { num: 3, label: "第3節" }, { num: 4, label: "第4節" },
                { num: 5, label: "第5節" }, { num: 6, label: "第6節" },
                { num: 7, label: "第7節" }, { num: 8, label: "第8節" }
            ];

            periods.forEach((p, index) => {
                const tr = document.createElement('tr');
                
                // 【重點更新】強制每列高度一致 (h-[140px])
                tr.className = "h-[140px]"; 
                if (index === 3) tr.classList.add("table-row-sep");

                let rowHtml = `
                    <td class="px-2 py-3 border-r border-gray-200 bg-gray-50 text-gray-700 text-center whitespace-nowrap align-middle">
                        <div class="font-bold text-base mb-1">${p.label}</div>
                        <div class="text-[0.7rem] text-emerald-700 tracking-tighter leading-tight mb-0.5">國 ${juniorHighTimes[p.num]}</div>
                        <div class="text-[0.7rem] text-blue-700 tracking-tighter leading-tight">高 ${seniorHighTimes[p.num]}</div>
                    </td>`;

                for (let day = 1; day <= 5; day++) {
                    let cellContent = ''; // 因為 tr 已經固定高度，這裡不需要再放撐高的 div

                    if (classData[day] && classData[day][p.num] && classData[day][p.num].length > 0) {
                        const classes = classData[day][p.num];
                        
                        classes.sort((a, b) => {
                            if (a.oddEven === '單' && b.oddEven === '雙') return -1;
                            if (a.oddEven === '雙' && b.oddEven === '單') return 1;
                            return 0;
                        });

                        let innerHtml = '';

                        classes.forEach((cellData, idx) => {
                            // 第一行：科目 (單雙週)
                            const oddEvenString = cellData.oddEven ? `<span class="text-[0.9rem] text-red-600 font-bold ml-1">(${cellData.oddEven}週)</span>` : '';
                            let htmlContent = `
                                <div class="font-bold text-amber-900 text-[1.1rem] leading-tight mb-0.5">
                                    ${cellData.subject}${oddEvenString}
                                </div>
                            `;
                            
                            // 第二行：教師姓名 (無底色藍字)
                            const teacherNameDisplay = cellData.teacher ? cellData.teacher : '&nbsp;';
                            htmlContent += `
                                <div class="text-blue-600 font-bold text-[0.85rem] h-[1.3rem] leading-[1.3rem] mb-1">
                                    ${teacherNameDisplay}
                                </div>
                            `;
                            
                            // 第三行：教室位置
                            if (cellData.location) {
                                htmlContent += `
                                    <div class="inline-block px-2 py-0.5 bg-gray-200 text-gray-700 rounded text-[0.75rem]">
                                        ${cellData.location}
                                    </div>
                                `;
                            } else {
                                htmlContent += `<div class="h-[1.25rem]"></div>`;
                            }

                            const separatorClass = idx > 0 ? "border-t-2 border-dashed border-gray-300 pt-2 mt-2" : "";
                            innerHtml += `<div class="${separatorClass}">${htmlContent}</div>`;
                        });

                        cellContent = `<div class="p-1 h-full flex flex-col justify-center">${innerHtml}</div>`;
                    }
                    rowHtml += `<td class="px-2 py-2 border-r border-gray-200 align-middle transition-colors hover:bg-amber-50">${cellContent}</td>`;
                }

                tr.innerHTML = rowHtml;
                timetableBody.appendChild(tr);
            });
        }

        searchBtn.addEventListener('click', handleSearch);
        classSelect.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });

        function handleSearch() {
            const searchClassName = classSelect.value;
            if (searchClassName) renderTimetable(searchClassName);
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(attemptAutoLoad, 100);
        });

    </script>
</body>
</html>
